<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080f" />
    <meta name="description" content="THE FLASH — stream cinematic stories and read light novels in one place." />
    <title>THE FLASH</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%23ff7a18'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%230a0b14'/%3E%3Cpath d='M18.5 4 8.5 18h5.2l-2.4 10L22 13.5h-5.6L18.5 4Z' fill='url(%23g)'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      html { background: #07080f; }
      #boot {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(1200px 600px at 50% 20%, #141034 0%, #07080f 55%);
        transition: opacity .45s ease;
      }
      #boot .b-logo { font-family: 'Sora', sans-serif; font-weight: 800; font-size: clamp(40px, 8vw, 64px);
        letter-spacing: .04em; background: linear-gradient(100deg, #ff7a18, #ffd166 35%, #7c3aed 75%);
        -webkit-background-clip: text; background-clip: text; color: transparent; }
      #boot .b-bar { width: min(240px, 60vw); height: 3px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.08); }
      #boot .b-bar i { display: block; height: 100%; width: 40%; border-radius: 99px;
        background: linear-gradient(90deg, #ff7a18, #7c3aed); animation: bslide 1.1s ease-in-out infinite; }
      #boot.done { opacity: 0; pointer-events: none; }
      @keyframes bslide { 0% { transform: translateX(-110%); } 100% { transform: translateX(280%); } }
    </style>
  </head>
  <body>
    <div id="boot"><div class="b-logo">&#120156;&#120140;&#120138;&#120138;&#120136;</div><div class="b-bar"><i></i></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
